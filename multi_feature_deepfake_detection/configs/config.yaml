project:
  name: multi_feature_deepfake_detection
  seeds: [42, 123, 2025]
  image_size: 224
  num_workers: 4

model:
  feature_dim: 256
  num_heads: 8
  fusion_layers: 2
  dropout: 0.3
  fusion_type: cross_attention  # options: concat, cross_attention, dual_attention
  use_contrastive: false
  contrastive_weight: 0.1
  temperature: 0.07

training:
  batch_size: 32
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  use_amp: true
  checkpoint_dir: checkpoints
  output_dir: outputs

evaluation:
  threshold: 0.5
